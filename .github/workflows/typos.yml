name: Spell Check

# Catches typos in AI-generated drafts (and everything else) before they're
# published. Dictionary exceptions live in _typos.toml at the repo root.

on:
  pull_request:
  push:
    branches: [master]
  # Dispatched by the blog-draft workflows; see ci.yml.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to a full commit SHA so a moved/compromised tag can't inject
      # code into the workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2
