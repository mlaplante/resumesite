name: Scorecard

# OpenSSF Scorecard supply-chain security analysis. Uploads results to the
# Security tab (SARIF) and publishes them to the Scorecard API, which drives
# the README badge.

on:
  schedule:
    # Weekly, Saturday 03:17 UTC — off-peak and clear of the other crons here.
    - cron: '17 3 * * 6'
  push:
    # Branch-protection changes only affect the score on the default branch.
    branches: [master]
  workflow_dispatch:

# Scorecard's documented recommendation; the job grants its own writes below.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write  # upload SARIF results to the Security tab
      id-token: write  # sign the results for publish_results
    steps:
      # Actions are pinned to full commit SHAs so a moved/compromised tag
      # can't inject code into the workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_format: sarif
          results_file: results.sarif
          # Publish to the Scorecard REST API so the badge/viewer stay current.
          publish_results: true

      # Keep a short-lived copy of the raw SARIF for debugging score changes.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
