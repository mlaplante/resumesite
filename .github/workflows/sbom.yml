name: SBOM

# Supply-chain transparency: generate CycloneDX SBOMs for both npm roots
# (worker + tooling at /, the Astro site at /blog-src) straight from their
# lockfiles, then attach signed build-provenance attestations so anyone can
# verify which commit and workflow run produced each SBOM
# (gh attestation verify sbom-root.cdx.json --repo mlaplante/resumesite).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to master supersedes any in-flight SBOM run.
concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: Generate + attest SBOMs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write      # OIDC token for Sigstore signing of the attestation
      attestations: write  # persist the attestation to the repo
    steps:
      # Actions are pinned to full commit SHAs so a moved/compromised tag
      # can't inject code into the workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # --package-lock-only derives the SBOM from the lockfile alone, so
      # neither root needs an npm ci first.
      - name: Generate SBOM (worker + tooling root)
        run: npm sbom --sbom-format cyclonedx --package-lock-only > sbom-root.cdx.json

      - name: Generate SBOM (Astro site)
        run: npm sbom --sbom-format cyclonedx --package-lock-only > ../sbom-site.cdx.json
        working-directory: blog-src

      - name: Upload SBOMs
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sbom-cyclonedx
          path: |
            sbom-root.cdx.json
            sbom-site.cdx.json
          if-no-files-found: error

      # Sign a provenance statement for the SBOM files themselves, tying them
      # to this repo, commit, and workflow run.
      - name: Attest SBOM provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            sbom-root.cdx.json
            sbom-site.cdx.json
