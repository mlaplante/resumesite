name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to the same branch/PR supersedes any in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    name: Worker + lib tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs so a moved/compromised tag
      # can't inject code into the workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            blog-src/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The lib tests import Astro-side modules (blog-src/src/utils), which
      # need blog-src's node_modules for both their imports (pdfkit, wawoff2)
      # and the tsconfig extends chain (astro/tsconfigs/strict).
      - name: Install site dependencies
        run: npm ci
        working-directory: blog-src

      # Worker integration tests (real Workers runtime + Miniflare D1) and
      # shared-lib unit tests.
      - name: Run tests
        run: npm test

  site:
    name: Astro typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            blog-src/package-lock.json

      - name: Install site dependencies
        run: npm ci
        working-directory: blog-src

      # Root tooling: tsc + @cloudflare/workers-types for the Worker typecheck,
      # vitest for the build-output smoke tests below.
      - name: Install root dependencies
        run: npm ci

      # `astro check` over blog-src plus `tsc` over worker/.
      - name: Typecheck
        run: npm run typecheck

      # Full production build: validates content-collection frontmatter for
      # every post/draft (including AI-generated drafts), renders OG images,
      # and runs the PurgeCSS + minify + fingerprint passes.
      - name: Build site
        run: npm run build

      # Smoke-test the freshly built dist/: required routes/endpoints exist,
      # OG cards and the PDF résumé rendered, search index is populated.
      - name: Smoke-test build output
        run: npx vitest run --project site

      # Lighthouse audit of key pages in the built dist/ (see lighthouserc.json).
      # Accessibility, best-practices and SEO below 100 fail the job; performance below 0.95 warns.
      # Pinned to an exact version: this step blocks merges, so a new @lhci/cli
      # (and the Lighthouse it bundles) must not land on CI unreviewed. Bump
      # deliberately, the same way the SHA-pinned actions above are bumped.
      - name: Lighthouse audit
        run: |
          npx --yes @lhci/cli@0.15.1 collect
          npx --yes @lhci/cli@0.15.1 assert
